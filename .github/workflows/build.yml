name: Build installer .exe

# Build the standalone Windows installer and attach it to a GitHub Release.
# - Pushing a tag like "v1.0.0" creates/updates a Release with the .exe.
# - Every push to main runs the tests, builds and smoke-tests the .exe, so a
#   broken build shows up on the commit that broke it, not at release time.
#   Pushes that only touch docs are skipped (path filters never apply to tags).
# - Manual runs (workflow_dispatch) build and upload the .exe as an artifact
#   you can download from the run page (handy for testing before tagging).

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: write   # needed to create/update Releases

jobs:
  build-windows-exe:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      # The python.org build, not actions/setup-python: setup-python's 3.14
      # carries Tcl/Tk 9, which makes the .exe ~2.3 MB bigger and is not the
      # toolkit the GUI was tested with. python.org's ships Tcl/Tk 8.6.
      - name: Set up Python (python.org build)
        shell: pwsh
        run: |
          $version = "3.14.5"
          $dir = Join-Path $env:RUNNER_TEMP "python"
          Invoke-WebRequest "https://www.python.org/ftp/python/$version/python-$version-amd64.exe" -OutFile python-setup.exe
          Start-Process python-setup.exe -Wait -ArgumentList "/quiet", "InstallAllUsers=0", "Include_launcher=0", "Include_test=0", "Include_doc=0", "Shortcuts=0", "TargetDir=$dir"
          Remove-Item python-setup.exe
          $dir, (Join-Path $dir "Scripts") | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          & (Join-Path $dir "python.exe") -c "import sys, tkinter; print(sys.version); print('Tcl/Tk', tkinter.TclVersion)"

      - name: Check tag matches __version__
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          want="qbt-plugin-installer ${GITHUB_REF_NAME#v}"
          # Python on Windows ends lines with \r\n; $(...) only strips the \n.
          got="$(python install_qbt_plugins.py --version | tr -d '\r')"
          if [ "$got" != "$want" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match __version__ ($got). Bump __version__ in install_qbt_plugins.py first."
            exit 1
          fi

      - name: Unit tests
        run: |
          python -m pip install pytest==9.1.1
          python -m pytest -q

      - name: Install PyInstaller
        run: python -m pip install pyinstaller==6.21.0  # the version the .exe was tested with

      - name: Build one-file executable
        run: python -m PyInstaller --noconfirm qbt-plugin-installer.spec

      # Run the built .exe, not the source: a module the spec leaves out
      # fails only in the frozen build. This installs into a scratch folder
      # (downloading every pinned file and checking its SHA-256), runs the
      # installer's own check that every engine loads, cross-checks that
      # against nova2.py --capabilities, then uninstalls. A failure here
      # stops the release below.
      - name: Smoke-test the .exe
        shell: pwsh
        run: |
          $exe = (Get-ChildItem dist\qbt-plugin-installer-*.exe).FullName
          $nova3 = Join-Path $env:RUNNER_TEMP "smoke\nova3"
          $engines = Join-Path $nova3 "engines"
          $log = Join-Path $env:RUNNER_TEMP "smoke.log"
          $err = Join-Path $env:RUNNER_TEMP "smoke.err"

          function Invoke-Installer([string[]] $more) {
            $argList = @("--engines-dir", "`"$engines`"", "--yes", "--no-restart") + $more
            $p = Start-Process $exe -ArgumentList $argList -Wait -PassThru -NoNewWindow `
                   -RedirectStandardOutput $log -RedirectStandardError $err
            Get-Content $log, $err
            if ($p.ExitCode -ne 0) { throw "installer $more exited with code $($p.ExitCode)" }
          }

          Invoke-Installer @()

          # What the installer says it installed, plus the update notice.
          $record = Get-Content (Join-Path $engines "qbt-plugin-installer.json") -Raw | ConvertFrom-Json
          $want = @($record.plugins | ForEach-Object { [IO.Path]::GetFileNameWithoutExtension($_) }) + "installer_updates" | Sort-Object
          if ($want.Count -lt 10) { throw "only $($want.Count) engines installed" }
          $xml = [xml]((python (Join-Path $nova3 "nova2.py") --capabilities) -join "`n")
          $got = $xml.capabilities.ChildNodes | ForEach-Object { $_.LocalName } | Sort-Object
          $diff = Compare-Object @($want) @($got)
          if ($diff) { $diff | Format-Table | Out-String | Write-Host; throw "engine list from nova2.py does not match" }
          Write-Host "nova2.py lists all $(@($got).Count) engines."

          Invoke-Installer @("--uninstall")
          $left = Get-ChildItem $engines -Filter *.py | Where-Object { $want -contains $_.BaseName }
          if ($left) { throw "uninstall left: $($left.Name -join ', ')" }
          Write-Host "Uninstall removed them all."

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: qbt-plugin-installer
          path: dist/qbt-plugin-installer-*.exe

      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/qbt-plugin-installer-*.exe
