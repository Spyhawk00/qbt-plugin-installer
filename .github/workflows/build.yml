name: Build installer .exe

# Build the standalone Windows installer and attach it to a GitHub Release.
# - Pushing a tag like "v1.0.0" creates/updates a Release with the .exe.
# - Manual runs (workflow_dispatch) build and upload the .exe as an artifact
#   you can download from the run page (handy for testing before tagging).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write   # needed to create/update Releases

jobs:
  build-windows-exe:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      # The python.org build, not actions/setup-python: setup-python's 3.14
      # carries Tcl/Tk 9, which makes the .exe ~2.3 MB bigger and is not the
      # toolkit the GUI was tested with. python.org's ships Tcl/Tk 8.6.
      - name: Set up Python (python.org build)
        shell: pwsh
        run: |
          $version = "3.14.5"
          $dir = Join-Path $env:RUNNER_TEMP "python"
          Invoke-WebRequest "https://www.python.org/ftp/python/$version/python-$version-amd64.exe" -OutFile python-setup.exe
          Start-Process python-setup.exe -Wait -ArgumentList "/quiet", "InstallAllUsers=0", "Include_launcher=0", "Include_test=0", "Include_doc=0", "Shortcuts=0", "TargetDir=$dir"
          Remove-Item python-setup.exe
          $dir, (Join-Path $dir "Scripts") | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          & (Join-Path $dir "python.exe") -c "import sys, tkinter; print(sys.version); print('Tcl/Tk', tkinter.TclVersion)"

      - name: Check tag matches __version__
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          want="qbt-plugin-installer ${GITHUB_REF_NAME#v}"
          # Python on Windows ends lines with \r\n; $(...) only strips the \n.
          got="$(python install_qbt_plugins.py --version | tr -d '\r')"
          if [ "$got" != "$want" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match __version__ ($got). Bump __version__ in install_qbt_plugins.py first."
            exit 1
          fi

      - name: Install PyInstaller
        run: python -m pip install pyinstaller==6.21.0  # the version the .exe was tested with

      - name: Build one-file executable
        run: python -m PyInstaller --noconfirm qbt-plugin-installer.spec

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: qbt-plugin-installer
          path: dist/qbt-plugin-installer-*.exe

      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/qbt-plugin-installer-*.exe
